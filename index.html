<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxipic - حجز تاكسي عصري</title>
    <!-- Pi SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root {
            --primary: #5b2c6f;
            --primary-light: #8e44ad;
            --accent: #f39c12;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #2d3748;
            --text-muted: #718096;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .phone-frame {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* الهيدر العلوي وشعار التطبيق */
        .app-header {
            background: var(--primary);
            color: #fff;
            padding: 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 15px rgba(91, 44, 111, 0.3);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: #fff;
            color: var(--primary);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .brand-title h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-title p {
            font-size: 11px;
            color: #d7bde2;
        }

        .btn-signin {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-signin:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* محتوى التطبيق */
        .app-content {
            padding: 20px;
        }

        /* صندوق مسارات الرحلة */
        .route-card {
            background: #fff;
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            border: 1px solid #edf2f7;
            margin-bottom: 20px;
        }

        .route-input-group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-green { background: #27ae60; box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.15); }
        .dot-red { background: #e74c3c; box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.15); }

        .route-input-group input {
            border: none;
            background: transparent;
            width: 100%;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            font-weight: 500;
        }

        .route-divider {
            height: 1px;
            background: #e2e8f0;
            margin: 8px 0 8px 24px;
        }

        /* خيارات السيارات */
        .section-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .cars-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .car-option {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .car-option.selected {
            border-color: var(--primary);
            background: rgba(91, 44, 111, 0.05);
            transform: translateY(-2px);
        }

        .car-option .car-emoji {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .car-option .car-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }

        .car-option .car-price {
            font-size: 12px;
            color: var(--primary);
            font-weight: 800;
            margin-top: 4px;
        }

        /* زر الحجز الرئيسي */
        .btn-book {
            width: 100%;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(243, 156, 18, 0.3);
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-book:active {
            transform: scale(0.97);
        }

        .footer-credit {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- Header -->
    <div class="app-header">
        <div class="brand-box">
            <div class="logo-icon">🚖</div>
            <div class="brand-title">
                <h1>Taxipic</h1>
                <p>Smart Ride Service</p>
            </div>
        </div>
        <button class="btn-signin" id="user-btn" onclick="onPiSignIn()">Pi Sign-In</button>
    </div>

    <!-- Body -->
    <div class="app-content">
        
        <!-- Route Selection -->
        <div class="route-card">
            <div class="route-input-group">
                <span class="dot dot-green"></span>
                <input type="text" id="pickup" value="تونس العاصمة - مركز المدينة" placeholder="موقع الانطلاق
