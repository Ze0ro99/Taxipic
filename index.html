<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxipic</title>
    <!-- روابط التصميم أو الخطوط إذا وجدت -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* يمكنك وضع التنسيقات هنا أو في ملف CSS خارجي */
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .logo-area {
            text-align: center;
            margin: 20px 0;
        }
        .logo-img {
            max-width: 150px;
            height: auto;
        }
        .search-bar {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- قائمة اللغات أو العناصر الأخرى إن وجدت -->
        <div class="language-menu">
            <div class="lang-option active">
                <img src="https://flagcdn.com/sa.svg" alt="AR" width="20">
                <span>AR</span>
            </div>
            <div class="lang-option">
                <img src="https://flagcdn.com/fr.svg" alt="FR" width="20">
                <span>FR</span>
            </div>
            <div class="lang-option">
                <img src="https://flagcdn.com/gb.svg" alt="EN" width="20">
                <span>EN</span>
            </div>
        </div>

        <!-- Logo Area (Enlarged and Text Removed) -->
        <div class="logo-area">
            <img src="logo-taxi.png" alt="Taxipic Logo" class="logo-img">
        </div>

        <!-- Map Container -->
        <div id="map" style="width: 100%; height: 250px; border-radius: 16px; margin-top: 20px; border: 1px solid rgba(255, 255, 255, 0.1);"></div>

        <!-- Search Bar -->
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </div>
    </main>

    <script src="map.js"></script>
</body>
</html>
